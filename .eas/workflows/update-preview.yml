name: Testversion aktualisieren (EAS Update)

# Neue App-Logik (JS) ohne Neuinstallation auf die Testgeräte bringen.
# Updates erreichen nur Builds mit gleichem nativen Fingerabdruck (runtimeVersion: fingerprint);
# nach neuen nativen Modulen zuerst „Testversion bauen“.
# Start: eas workflow:run update-preview.yml (oder über das Expo-Dashboard).

on:
  workflow_dispatch:
    inputs:
      message:
        type: string
        required: false
        description: 'Was ist neu?'

jobs:
  update:
    name: Update auf Kanal preview
    type: update
    environment: preview
    # Gleiche Werte wie das Build-Profil „preview“ (eas.json): Demo-Daten und Diagnose.
    # Sonst würde ein Update mit Server-Werten aus der EAS-Umgebung die Testversion umschalten.
    env:
      APP_VARIANT: preview
      EXPO_PUBLIC_DATA_MODE: memory
      EXPO_PUBLIC_DIAGNOSTICS: '1'
    params:
      channel: preview
      message: ${{ inputs.message || 'Testversion aktualisiert' }}
