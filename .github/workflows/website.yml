name: Webseite und Praxis-Dashboard bereitstellen

# Baut die öffentliche Webseite (Datenschutz, Nutzungsbedingungen, Impressum aus docs/legal) und das
# Praxis-Dashboard (unter /praxis/) und lädt beides per SFTP oder FTPS auf einen Webspace in der EU.
# Anleitung: docs/website-setup.md. Ohne Zugang wird nur gebaut (Ergebnis als Artefakt „webseite“).
#
# GitHub → Settings → Secrets and variables → Actions:
#   Secrets:   UPLOAD_HOST, UPLOAD_USER, UPLOAD_PASSWORD   (vom Webhoster)
#   Variablen: UPLOAD_PROTOCOL   (sftp oder ftps; Standard sftp)
#              UPLOAD_DIR        (Zielordner auf dem Webspace, z. B. /  oder /mednow)
#              SUPPORT_EMAIL     (Kontaktadresse auf der Startseite, optional)
# Bestehende Dateien im Zielordner werden nicht gelöscht, nur ergänzt bzw. überschrieben.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Auf den Webspace hochladen (sonst nur bauen)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  website:
    name: Bauen und hochladen
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      - name: Abhängigkeiten
        run: |
          npm ci
          npm ci --prefix dashboard

      - name: Praxis-Dashboard bauen
        working-directory: dashboard
        run: |
          # Öffentliche Projektwerte wie im Produktions-Build der App (eas.json) – kein geheimer Schlüssel
          export VITE_DATA_MODE=supabase
          export VITE_SUPABASE_URL="$(jq -r '.build.production.env.EXPO_PUBLIC_SUPABASE_URL' ../eas.json)"
          export VITE_SUPABASE_ANON_KEY="$(jq -r '.build.production.env.EXPO_PUBLIC_SUPABASE_ANON_KEY' ../eas.json)"
          export VITE_BASE_PATH=/praxis/
          npm run build

      - name: Webseite bauen
        env:
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          DASHBOARD_DIST: dashboard/dist
        run: |
          export SUPABASE_URL="$(jq -r '.build.production.env.EXPO_PUBLIC_SUPABASE_URL' eas.json)"
          npx tsx scripts/build-website.ts site

      - uses: actions/upload-artifact@v4
        with:
          name: webseite
          path: site
          include-hidden-files: true
          retention-days: 14

      - name: Hochladen (SFTP oder FTPS)
        if: inputs.upload
        env:
          UPLOAD_HOST: ${{ secrets.UPLOAD_HOST }}
          UPLOAD_USER: ${{ secrets.UPLOAD_USER }}
          LFTP_PASSWORD: ${{ secrets.UPLOAD_PASSWORD }}
          UPLOAD_PROTOCOL: ${{ vars.UPLOAD_PROTOCOL }}
          UPLOAD_DIR: ${{ vars.UPLOAD_DIR }}
        run: |
          if [ -z "$UPLOAD_HOST" ] || [ -z "$UPLOAD_USER" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "::notice::Kein Upload-Zugang hinterlegt – nur gebaut. Ergebnis: Artefakt „webseite“ (docs/website-setup.md)."
            exit 0
          fi
          sudo apt-get install -y -qq lftp > /dev/null
          target="${UPLOAD_DIR:-/}"
          case "${UPLOAD_PROTOCOL:-sftp}" in
            sftp) url="sftp://$UPLOAD_HOST"; settings="set sftp:auto-confirm yes;" ;;
            # FTPS (explizit, AUTH TLS) – nie unverschlüsseltes FTP
            ftps) url="ftp://$UPLOAD_HOST"; settings="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes;" ;;
            *) echo "::error::UPLOAD_PROTOCOL muss sftp oder ftps sein"; exit 1 ;;
          esac
          # Neue Dateien und Änderungen hochladen; nichts auf dem Webspace löschen
          lftp -u "$UPLOAD_USER" --env-password "$url" -e "
            $settings
            set net:max-retries 3;
            mirror --reverse --verbose=1 --no-perms site/ '$target';
            bye"
          echo "## Webseite hochgeladen" >> "$GITHUB_STEP_SUMMARY"
          echo "Ziel: \`$target\` auf $UPLOAD_HOST (${UPLOAD_PROTOCOL:-sftp}) – Dashboard unter /praxis/" >> "$GITHUB_STEP_SUMMARY"
