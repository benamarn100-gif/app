# Supabase-Projektkonfiguration (lokal via `supabase start`, remote via `supabase config push`).
# Gehostetes Projekt: Region eu-central-1 (Frankfurt) beim Anlegen wählen.
project_id = "mednow"

[api]
enabled = true
port = 54321
# "app" enthält die security-definer-Funktionen für Edge Functions (nur service_role ausführbar).
schemas = ["public", "graphql_public", "app"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "terminluecke://"
additional_redirect_urls = ["terminluecke://**", "mednow://**", "exp://**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# App startet anonym (keine Daten), Upgrade per E-Mail-Code vor der ersten Buchung.
enable_anonymous_sign_ins = true
enable_manual_linking = true
minimum_password_length = 12

[auth.rate_limit]
email_sent = 6
anonymous_users = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 900

# Nur Codes, keine Links (App und Praxis-Dashboard). Vorlagen ohne Gesundheitsbezug.
[auth.email.template.magic_link]
subject = "Ihr Anmeldecode / Your sign-in code"
content_path = "./supabase/templates/code.html"

[auth.email.template.email_change]
subject = "Bestätigungscode / Confirmation code"
content_path = "./supabase/templates/email_change.html"

[auth.sms]
enable_signup = false

# Praxis-Dashboard: Zwei-Faktor-Anmeldung (TOTP) ist Pflicht für Patientendaten (aal2).
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

[functions.book_slot]
# Gemeinsame Import-Liste (beim Bereitstellen sonst nicht gefunden)
import_map = "./functions/deno.json"
verify_jwt = true

[functions.hold_slot]
# Gemeinsame Import-Liste (beim Bereitstellen sonst nicht gefunden)
import_map = "./functions/deno.json"
verify_jwt = true

[functions.cancel_appointment]
# Gemeinsame Import-Liste (beim Bereitstellen sonst nicht gefunden)
import_map = "./functions/deno.json"
verify_jwt = true

[functions.reschedule_appointment]
# Gemeinsame Import-Liste (beim Bereitstellen sonst nicht gefunden)
import_map = "./functions/deno.json"
verify_jwt = true

[functions.waitlist]
# Gemeinsame Import-Liste (beim Bereitstellen sonst nicht gefunden)
import_map = "./functions/deno.json"
verify_jwt = true

[functions.account]
# Gemeinsame Import-Liste (beim Bereitstellen sonst nicht gefunden)
import_map = "./functions/deno.json"
verify_jwt = true

# Worker: wird von pg_net/pg_cron aufgerufen, geschützt über WORKER_SECRET.
[functions.send_notifications]
# Gemeinsame Import-Liste (beim Bereitstellen sonst nicht gefunden)
import_map = "./functions/deno.json"
verify_jwt = false

[functions.billing_webhook]
# Abo-Ereignisse von RevenueCat; Echtheit über REVENUECAT_WEBHOOK_SECRET (kein Nutzer-JWT)
import_map = "./functions/deno.json"
verify_jwt = false

[analytics]
enabled = false
